<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">

  <!-- Correct place -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg">
      <h3 class="title">Cold E-Mail Generator</h3>

      <div class = 's1'>
          <h2 class = 'text'>Step 1 : Enter the job/intern posting URL</h2>
          <input type="text" class = 'inputs' id = 'url' placeholder = 'Enter URL here'> 

          <h2 class = 'text'>Step 2 : Upload your resume in PDF format</h2>
          <input type="file" class = 'inputs' id = 'resume' placeholder = 'Upload Resume here' accept=".pdf">
          <h2 class = 'text'>Step 3 : Generate E-Mail</h2>
          <button class = 'clicks' style = 'margin-bottom : 40px' onclick = "output()">Generate</button>
      
      </div>
      <div class = 's2'>
          <h2 class = 'text'>Generated E-Mail</h2>
          <div class = 'inputs' id = 'output'>Your generated Email will appear here</div>
      </div>
  </div>
  <div class = 'loader'>Generating Email....</div>
  <script src="logic.js"></script>
</body>
</html>
